name: asber

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asber}
      POSTGRES_DB: ${POSTGRES_DB:-asber}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asber} -d ${POSTGRES_DB:-asber}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # Not published to the host: only the application containers reach the database.

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-asber}:${POSTGRES_PASSWORD:-asber}@db:5432/${POSTGRES_DB:-asber}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "127.0.0.1:8000:8000"   # bound to localhost only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  scheduler:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-asber}:${POSTGRES_PASSWORD:-asber}@db:5432/${POSTGRES_DB:-asber}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      backend: { condition: service_started }
    command: ["python", "-m", "app.scheduler"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    environment:
      API_INTERNAL_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend: { condition: service_started }
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
